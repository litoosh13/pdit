# docker compose run --rm islands → bundles the Gooey React island (run before build/serve)
# docker compose run --rm build   → release build of the web app into target/dx/…/public
# docker compose up serve         → development server at http://localhost:8080
services:
  serve:
    build: .
    image: pdit-dev
    working_dir: /work/crates/pdit-app
    command: dx serve --platform web --addr 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes: &volumes
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/work/target
      - dx-tools:/root/.local/share/.dx   # wasm-bindgen, wasm-opt, esbuild fetched by dx
      - /work/.claude   # empty volume: keeps the private .claude/ folder out of the container
  build:
    build: .
    image: pdit-dev
    working_dir: /work/crates/pdit-app
    command: dx build --platform web --release
    volumes: *volumes
  islands:
    image: node:24-bookworm-slim
    working_dir: /work/web/gooey-island
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - .:/work
      - /work/.claude   # empty volume: keeps the private .claude/ folder out of the container
      - gooey-node-modules:/work/web/gooey-island/node_modules
  check:
    build: .
    image: pdit-dev
    command: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
    volumes: *volumes

volumes:
  gooey-node-modules:
  dx-tools:
  cargo-registry:
  cargo-git:
  target:
