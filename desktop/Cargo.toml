[package]
name = "pdit-desktop"
description = "pdit's desktop app: the pdit web build in a Tauri window, with native file saving (D-032, D-046)."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Updates from GitHub Releases (D-058), signed.
tauri-plugin-updater = "2"
# The native Save dialog: WebKit has no showSaveFilePicker, so pdit's Save falls
# back to a download, which this app turns into a Save dialog.
rfd = "0.17"
# OCR for scanned pages (D-055): leafmind runs the bundled Tesseract (resources/ocr, fetched by
# scripts/fetch-ocr.sh); the web app sends page images through the commands in main.rs.
leafmind-ocr = { git = "https://github.com/litoosh13/leafmind", tag = "v0.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Asking questions (D-056): leafmind picks the answering sentence; its models are downloaded on first
# use (qa.rs), ONNX Runtime is loaded at run time.
leafmind-qa = { git = "https://github.com/litoosh13/leafmind", tag = "v0.3.1" }
# Keys the kept question index by the PDF's bytes.
sha2 = "0.11"

# Own workspace: Tauri's native dependencies stay out of the web (wasm) build.
[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = true
