[package]
name = "pdit-app"
description = "pdit's web app (Dioxus)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The self-check (self_check.rs) in an optimized build too, for the Windows/Linux run
# (.github/workflows/selfcheck.yml). Debug builds always have it.
self-check = []

[dependencies]
dioxus.workspace = true
pdit-core.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
web-sys = { workspace = true, features = ["AddEventListenerOptions", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "console", "CssStyleDeclaration", "Document", "DomTokenList", "Element", "DomRect", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "ImageData", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "KeyboardEvent", "MouseEvent", "PointerEvent", "ResizeObserver", "Response", "WheelEvent", "Storage", "Url", "Window"] }
