# Checks every push and pull request: formatting, lints (warnings are errors),
# the engine's tests, and that the web app builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain (1.98.1 + wasm32) comes from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PDFium (pinned, checksum-verified)
        run: scripts/fetch-pdfium.sh

      - name: React island
        working-directory: web/gooey-island
        run: npm ci --no-audit --no-fund && npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings

      - name: Engine tests
        run: cargo test -p pdit-core

      - uses: cargo-bins/cargo-binstall@main

      - name: Web build
        run: |
          cargo binstall dioxus-cli@0.7.10 --no-confirm
          cd crates/pdit-app && dx build --release --platform web
