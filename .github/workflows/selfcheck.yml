# Runs pdit's desktop self-check on real Windows and Linux machines: builds the web app optimized, as released, plus
# the self-check (feature "self-check"; the debug web build is too big to load in the window, P-049), the desktop app
# around it, starts it (Linux: on a virtual screen) and lets it check itself — editing,
# forms, page tools, Compress, Word export and more (crates/pdit-app/src/self_check.rs). The app quits by itself when
# done (PDIT_SELFCHECK_EXIT); the job fails when a check failed. Start it from the Actions tab: "Self-check" → Run.
name: Self-check

on:
  workflow_dispatch:

jobs:
  selfcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y make clang libclang-dev xvfb

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PDFium (pinned, checksum-verified)
        run: scripts/fetch-pdfium.sh

      - name: React island
        working-directory: web/gooey-island
        run: npm ci --no-audit --no-fund && npm run build

      - uses: cargo-bins/cargo-binstall@main

      - name: Build tools
        run: |
          cargo binstall tauri-cli@2.12.1 --no-confirm
          if [ "$RUNNER_OS" != "Windows" ]; then
            cargo install dioxus-cli --version 0.7.10 --locked
          else
            cargo binstall dioxus-cli@0.7.10 --no-confirm
          fi

      - name: Web app (optimized, with the self-check)
        working-directory: crates/pdit-app
        run: dx build --release --platform web --features self-check

      - name: Desktop app (debug, the web app inside)
        working-directory: desktop
        run: >
          cargo tauri build --debug --no-bundle
          --config '{"build":{"beforeBuildCommand":"","frontendDist":"../target/dx/pdit-app/release/web/public"}}'

      - name: Run the self-check
        env:
          PDIT_SELFCHECK_EXIT: "1"
          # WebKitGTK on a virtual screen without a GPU.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          app=desktop/target/debug/pdit-desktop
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          set +e
          timeout 1200 $run "$app" 2>&1 | tee selfcheck.log
          code=${PIPESTATUS[0]}
          set -e
          echo "--- summary ---"
          grep -E "self-check (FAIL|summary)|desktop self-check done|panicked" selfcheck.log || true
          if ! grep -q "desktop self-check done" selfcheck.log; then
            echo "The self-check didn't finish (exit code $code)."; exit 1
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-${{ matrix.os }}
          path: selfcheck.log
